[source]
repository = userchba/LibDDLA
branch = develop

[remote]
host_alias = SAI-libddla-ci
project_root = /org/org-open-sai/libddla-ci/daily

[slurm]
partition = 16V100
account = org-open-sai
qos = flood-gpu
poll_seconds = 20
deadline_seconds = 14400
lease_seconds = 600

[build]
ranks = 4
gpus = 4
time_seconds = 1800
parallelism = 16

# flood-gpu allocates GPUs in multiples of four. Each MPI rank uses one GPU.
# Arrays are grouped by their complete Slurm resource request.
[resource.mpi1]
ranks = 1
gpus = 4
time_seconds = 900
parallelism = 2

[resource.mpi2]
ranks = 2
gpus = 4
time_seconds = 900
parallelism = 1

[resource.mpi4]
ranks = 4
gpus = 4
time_seconds = 900
parallelism = 4

[resource.mpi6]
ranks = 6
gpus = 8
time_seconds = 1200
parallelism = 1

# Additional GPU coverage using the same CUDA binaries as the registered tests.
[extra.test_pgeadd_indexed_mpi6_1x6]
binary = test_pgeadd_indexed
arguments = 1 6
ranks = 6

[extra.test_pgemm_branches_mpi6_1x6]
binary = test_pgemm_branches
arguments = 1 6
ranks = 6
