name: Daily GPU validation
run-name: LibDDLA GPU / upstream develop

on:
  schedule:
    - cron: "30 20 * * *" # 04:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      runner_check:
        description: "Check runner availability without submitting Slurm jobs"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: libddla-daily-gpu
  cancel-in-progress: false

jobs:
  gpu:
    name: GPU tests on SAI / upstream develop
    if: github.repository == 'Stardust0831/LibDDLA' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, sai-libddla-daily]
    timeout-minutes: 270
    steps:
      - name: Checkout workflow controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check runner and installed controller
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(cat /opt/libddla-control/control-sha)" = "$CONTROL_SHA"
          test -r /srv/libddla-daily/results
          test -w /srv/libddla-daily/requests
          echo "Runner is ready; installed controller: $CONTROL_SHA"

      - name: Build, run GPU arrays and publish case results
        if: ${{ !inputs.runner_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u .ci/slurm/wait.py

      - name: Upload source, logs, JUnit and structured results
        if: ${{ always() && !inputs.runner_check }}
        uses: actions/upload-artifact@v4
        with:
          name: libddla-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/libddla-gpu-results
          if-no-files-found: error
          retention-days: 30
